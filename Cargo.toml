[workspace]
members = ["crates/binman-core", "crates/binman"]
resolver = "3"

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.90"
license-file = "LICENSE"
repository = "https://github.com/bgunnarsson/binman"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "signal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio-util = "0.7"
